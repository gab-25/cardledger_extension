# `test` (typecheck and tests) runs on every push to main and on a published GitHub release; on a release only,
# `package` then runs `npm run package` and attaches cardledger-sync-<version>.zip to the release.
# The extension's version is the release tag (v1.2.3 or 1.2.3), not package.json's (set only in the CI checkout).
name: CI

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $TAG is not a version (v1.2.3 or 1.2.3)"
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - run: npm run package

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" cardledger-sync-*.zip --clobber
