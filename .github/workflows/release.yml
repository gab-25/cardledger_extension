# On a published GitHub release: test, `npm run package`, attach cardledger-sync-<version>.zip to the release.
# The release tag must match package.json's version (v0.2.0 or 0.2.0 for "version": "0.2.0").
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # gh release upload

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" cardledger-sync-*.zip --clobber
